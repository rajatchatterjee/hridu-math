<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="Hridu's Great Rescue game"></canvas></div>
<div id="rotate">
  <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="#FFC21A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M2 12a10 10 0 0 0 4 8"/><path d="M4 21l2-1-.5-2.2"/></svg>
  <div>Turn your phone sideways to play</div>
  <button type="button" id="rotateBtn">Play anyway</button>
</div>
<script>
'use strict';
/* =====================================================================
   Hridu's Great Rescue — a kids' adventure game with puzzle pit stops.
   One file, no build step. Works with a TV remote (D-pad + OK + Back),
   a keyboard (arrows / Enter / Esc) and touch (on-screen buttons).
   URL params for testing: ?break=30 (puzzle every 30 s), ?level=N
   ===================================================================== */
const W = 1280, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'Fredoka,"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif';
const font = (s, w) => `${w || 600} ${s}px ${FONT}`;
let K = 1, T = 0;

/* ---------------- save data ---------------- */
const SAVE_KEY = 'hridu-math-v1';
let save = { unlocked: 1, stars: {}, interval: 5, sound: true, music: true, outfit: 'space', clock: 0, solved: 0, seenIntro: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const params = new URLSearchParams(location.search);
const BREAK_OVERRIDE = +params.get('break') || 0;
if (save.interval !== 3 && save.interval !== 5) save.interval = 5; // only 3 or 5 min allowed
// Older versions capped progress at level 8: unlock the level after the highest one completed.
{ const done = Object.keys(save.stars || {}).map(Number).filter(n => save.stars[n] > 0); if (done.length) save.unlocked = Math.max(save.unlocked, Math.min(28, Math.max(...done) + 1)); }
const breakEvery = () => BREAK_OVERRIDE || save.interval * 60;
if (+params.get('level')) save.unlocked = Math.max(save.unlocked, Math.min(28, +params.get('level')));

/* ---------------- helpers ---------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weighted(obj) { let tot = 0; for (const k in obj) tot += obj[k]; let r = Math.random() * tot; for (const k in obj) { r -= obj[k]; if (r <= 0) return k; } return Object.keys(obj)[0]; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtTime = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fillRR(x, y, w, h, r, c) { rr(x, y, w, h, r); ctx.fillStyle = c; ctx.fill(); }
function circle(x, y, r, c) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function ell(x, y, rx, ry, c, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function line(x1, y1, x2, y2, c, w) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
function text(s, x, y, size, color, align, weight, base) { ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle'; ctx.fillText(s, x, y); }
function wrapLines(s, maxW, size, weight) {
  ctx.font = font(size, weight); const out = [];
  for (const para of String(s).split('\n')) {
    let cur = '';
    for (const w of para.split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
    out.push(cur);
  }
  return out;
}
function starPath(x, y, r, inner) { inner = inner || 0.45; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } ctx.closePath(); }
function drawStar(x, y, r, c, stroke) { starPath(x, y, r); ctx.fillStyle = c; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(2, r / 8); ctx.lineJoin = 'round'; ctx.stroke(); } }
function heartPath(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s * 0.35); ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.45, y - s * 1.05, x, y - s * 0.45); ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35); ctx.closePath(); }
function drawHeart(x, y, s, c) { heartPath(x, y, s); ctx.fillStyle = c; ctx.fill(); }
function pill(x, y, w, h, c) { fillRR(x, y, w, h, h / 2, c); }

/* ---------------- audio ---------------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type, v, slide) {
  if (!save.sound || !AC) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(v || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const seq = (notes, gap, type, v) => notes.forEach((f, i) => setTimeout(() => tone(f, 0.18, type || 'triangle', v || 0.13), i * gap));
const SFX = {
  jump: () => tone(380, 0.18, 'square', 0.06, 320),
  coin: () => seq([880, 1320], 70, 'triangle', 0.1),
  hit: () => tone(200, 0.32, 'sawtooth', 0.1, -130),
  ok: () => seq([523, 659, 784], 90),
  bad: () => tone(240, 0.28, 'triangle', 0.12, -70),
  move: () => tone(620, 0.05, 'sine', 0.05),
  pick: () => seq([660, 990], 60, 'sine', 0.1),
  win: () => seq([523, 659, 784, 1047], 120),
  rescue: () => seq([587, 784, 988, 1175], 80),
};

/* ---------------- voice-over ----------------
   Uses the device's own text-to-speech: Android's engine inside the TV app
   (window.HriduTTS bridge), the browser's speechSynthesis on the web. Each
   character gets their own pitch/speed. Story and questions wait until the
   line has been read; with no voice available they wait for reading time. */
const VOICES = {
  hridu: { pitch: 1.3, rate: 1.0 }, zippy: { pitch: 1.15, rate: 1.08 }, hoot: { pitch: 0.75, rate: 0.9 },
  grumble: { pitch: 0.5, rate: 0.85 }, bibi: { pitch: 1.7, rate: 1.05 }, chiku: { pitch: 1.05, rate: 1.1 },
  kanta: { pitch: 0.9, rate: 0.95 }, ziggy: { pitch: 1.45, rate: 1.15 }, dolly: { pitch: 1.5, rate: 1.0 }, narrator: { pitch: 1.0, rate: 0.95 },

function spoken(t) {
  return String(t)
    .replace(/×/g, ' times ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ').replace(/=/g, ' equals ')
    .replace(/(^|\s)\?(?=\s|$)/g, ' what number ').replace(/\bkm\b/g, 'kilometres')
    .replace(/[▲▼◀▶✓]/g, ' ').replace(/\s+/g, ' ').trim();

const Voice = {
  id: 0, started: -99, est: 0, ended: true, failed: false, voice: null,
  web: 'speechSynthesis' in window,
  get native() { return !!window.HriduTTS; },
  pickVoice() {
    if (!this.web) return;
    let vs = []; try { vs = speechSynthesis.getVoices(); } catch (e) {}
    if (!vs.length) return;
    const norm = l => (l || '').replace('_', '-').toLowerCase();
    for (const p of ['en-in', 'en-gb', 'en-us', 'en']) { const v = vs.find(v => norm(v.lang).startsWith(p)); if (v) { this.voice = v; return; } }
    this.voice = vs[0];
  },
  say(text, who) {
    const line = spoken(text), pr = VOICES[who] || VOICES.narrator;
    this.stop();
    const id = ++this.id;
    this.started = T; this.est = 0.8 + line.length / (13 * pr.rate); this.ended = false; this.failed = false;
    if (this.native) { let ok = false; try { ok = window.HriduTTS.speak(line, pr.pitch, pr.rate, String(id)); } catch (e) {} if (!ok) this.failed = true; return; }
    if (this.web) {
      try {
        if (!this.voice) this.pickVoice();
        const u = new SpeechSynthesisUtterance(line);
        if (this.voice) { u.voice = this.voice; u.lang = this.voice.lang; } else u.lang = 'en-IN';
        u.pitch = pr.pitch; u.rate = pr.rate * 0.95;
        u.onend = () => { if (id === this.id) this.ended = true; };
        u.onerror = () => { if (id === this.id) this.failed = true; };
        speechSynthesis.speak(u);
      } catch (e) { this.failed = true; }
      return;
    }
    this.failed = true;
  },
  stop() { this.id++; this.ended = true; this.failed = false; try { if (this.native) window.HriduTTS.stop(); else if (this.web) speechSynthesis.cancel(); } catch (e) {} },
  // Has the current line been fully read? (No voice: after normal reading time.)
  done() { const t = T - this.started; if (this.failed) return t >= this.est; if (this.ended) return true; return t >= this.est * 2.5 + 3; },
  get speaking() { return !this.done(); },
};
window.hriduVoiceDone = id => { if (String(Voice.id) === String(id)) Voice.ended = true; };
window.hriduVoiceError = id => { if (String(Voice.id) === String(id)) Voice.failed = true; };
if (Voice.web) { Voice.pickVoice(); try { speechSynthesis.onvoiceschanged = () => Voice.pickVoice(); } catch (e) {} }

/* ---------------- background music (made in code, no files) ----------------
   Every level gets its own tune: a STYLE (scale, tempo, chords, instruments,
   drum groove) picked from the level's world, plus a melody generated from
   the level number, so no two levels sound the same. Drums are synthesized
   (kick / snare / hi-hat from noise). */
const SCALES = {
  major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11],
  mixo: [0, 2, 4, 5, 7, 9, 10], penta: [0, 2, 4, 7, 9], minPenta: [0, 3, 5, 7, 10], eastern: [0, 1, 4, 5, 7, 8, 10], whole: [0, 2, 4, 6, 8, 10],
};
// drums: one char per 8th note, 8 per bar — k kick, s snare, h hat, b kick+hat, . rest
// rhythm: melody pattern per bar — x note, - hold, . rest
const STYLES = {
  title:   { scale: 'major', root: 60, bpm: 112, prog: [0, 5, 3, 4], lead: 'triangle', drums: 'k.h.s.h.', rhythm: 'x.xxx.x.', bassPat: 'r.o.r.o.' },
  meadow:  { scale: 'major', root: 62, bpm: 132, prog: [0, 3, 4, 0], lead: 'square', drums: 'k.hks.h.', rhythm: 'xx.xx.x.', bassPat: 'r.r.o.o.' },
  sky:     { scale: 'lydian', root: 60, bpm: 104, prog: [0, 1, 4, 0], lead: 'triangle', drums: 'k...s..h', rhythm: 'x--.x.x.', bassPat: 'r...o...', arp: true },
  jungle:  { scale: 'minPenta', root: 57, bpm: 136, prog: [0, 3, 2, 0], lead: 'triangle', drums: 'k.hkk.s.', rhythm: 'x.xx.xx.', bassPat: 'r.rr.o.r' },
  desert:  { scale: 'eastern', root: 62, bpm: 118, prog: [0, 1, 0, 6], lead: 'square', drums: 'k..ks.h.', rhythm: 'x-xx.x--', bassPat: 'r..r.o..' },
  island:  { scale: 'mixo', root: 60, bpm: 112, prog: [0, 3, 6, 0], lead: 'triangle', drums: '.hkh.hsh', rhythm: '.x.xx.x.', bassPat: 'r..o.r..' },
  storm:   { scale: 'minor', root: 57, bpm: 144, prog: [0, 5, 2, 6], lead: 'square', drums: 'kkskkks.', rhythm: 'xxx.xx.x', bassPat: 'rrrrrroo' },
  reef:    { scale: 'dorian', root: 62, bpm: 92, prog: [0, 3, 1, 4], lead: 'sine', drums: 'k...h...', rhythm: 'x--.x-x.', bassPat: 'r...o...', arp: true },
  beach:   { scale: 'penta', root: 64, bpm: 138, prog: [0, 3, 4, 0], lead: 'triangle', drums: 'b.hbs.h.', rhythm: 'x.xxx.xx', bassPat: 'r.o.r.o.' },
  snow:    { scale: 'lydian', root: 62, bpm: 104, prog: [0, 4, 3, 0], lead: 'triangle', drums: '..h...h.', rhythm: 'x.x.x--.', bassPat: 'r...r...', arp: true },
  space:   { scale: 'whole', root: 55, bpm: 96, prog: [0, 2, 1, 3], lead: 'square', drums: 'k...s...', rhythm: 'x--.x--.', bassPat: 'r...o...', arp: true },
  sneaky:  { scale: 'minor', root: 57, bpm: 108, prog: [0, 5, 0, 4], lead: 'triangle', drums: 'k.h.s.hh', rhythm: 'x.xx..x.', bassPat: 'rorororo' },
  quiz:    { scale: 'major', root: 60, bpm: 118, prog: [0, 4, 5, 3], lead: 'square', drums: 'k.hhs.hh', rhythm: 'x.x.x.xx', bassPat: 'r.o.r.o.', arp: true },
  bouncy:  { scale: 'penta', root: 62, bpm: 142, prog: [0, 2, 3, 4], lead: 'triangle', drums: 'b.hbs.hb', rhythm: 'xx.xx.xx', bassPat: 'r.or.or.' },
  castle:  { scale: 'minor', root: 55, bpm: 126, prog: [0, 5, 6, 4], lead: 'square', drums: 'k.s.k.ss', rhythm: 'x.xx-.x.', bassPat: 'r.r.o.o.' },
  finale:  { scale: 'major', root: 60, bpm: 140, prog: [0, 4, 5, 3], lead: 'square', drums: 'kks.kks.', rhythm: 'x-xx.xx.', bassPat: 'rrorrror', arp: true },
  think:   { scale: 'dorian', root: 60, bpm: 80, prog: [0, 3, 1, 4], lead: 'sine', drums: '........', rhythm: 'x...x...', bassPat: 'r.......', arp: true, soft: true },
};
const THEME_STYLE = { meadow: 'meadow', hills: 'sky', clouds: 'sky', jungle: 'jungle', desert: 'desert', ocean: 'island', storm: 'storm', reef: 'reef', beach: 'beach', snow: 'snow', icecave: 'sneaky', space: 'space', moon: 'space', castle: 'castle' };
function styleForLevel(L) {
  if (L.n === LEVELS.length) return 'finale';
  if (L.mode === 'maze') return 'sneaky';
  if (L.mode === 'gates') return 'quiz';
  if (L.mode === 'catch') return L.theme === 'beach' ? 'beach' : 'bouncy';
  return THEME_STYLE[L.theme] || 'meadow';
}
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function buildTune(styleName, seed) {
  const st = STYLES[styleName], R = seeded(seed * 7919 + 13), sc = SCALES[st.scale], n = sc.length;
  const root = st.root + (seed % 3) - 1;
  // each level gets its own twist on the style's rhythm (bar 1 stays on the beat)
  let rhythm = st.rhythm.split(''); for (let k = 0; k < 2; k++) { const i = 1 + Math.floor(R() * 7); rhythm[i] = rhythm[i] === 'x' ? '.' : 'x'; } rhythm = rhythm.join('');
  const midi = deg => root + sc[((deg % n) + n) % n] + 12 * Math.floor(deg / n);
  const chordTones = c => [c, c + 2, c + 4];
  // a motif (contour) reused across bars so the tune has a hook
  const contour = []; for (let i = 0; i < 8; i++) contour.push(Math.floor(R() * 5) - 2);
  const mel = [], hold = [];
  for (let bar = 0; bar < 8; bar++) {
    const ch = st.prog[bar % 4] + n, rh = bar === 7 ? 'x--.....' : rhythm;
    let deg = chordTones(ch)[bar % 2 ? 1 : 0] + (bar >= 4 ? 2 : 0);
    for (let i = 0; i < 8; i++) {
      if (rh[i] === 'x') {
        if (i % 2 === 0) { const ct = chordTones(ch); let best = ct[0]; for (const c of [...ct, ...ct.map(x => x + n)]) if (Math.abs(c - deg) < Math.abs(best - deg)) best = c; deg = best; }
        else deg += (bar % 4 === 2 ? -1 : 1) * contour[i] || (R() < 0.5 ? 1 : -1);
        deg = clamp(deg, n, n * 2 + 4);
        if (bar === 7 && i === 0) deg = n;
        mel.push(midi(deg)); hold.push(rh[i + 1] === '-' ? (rh[i + 2] === '-' ? 3 : 2) : 1);
      } else { mel.push(0); hold.push(0); }
    }
  }
  const bass = [];
  for (let bar = 0; bar < 8; bar++) { const ch = st.prog[bar % 4]; for (let i = 0; i < 8; i++) { const p = st.bassPat[i]; bass.push(p === 'r' ? midi(ch) - 24 : p === 'o' ? midi(ch + 4) - 24 : 0); } }
  const arp = [];
  if (st.arp) for (let bar = 0; bar < 8; bar++) { const ch = st.prog[bar % 4] + n; for (let i = 0; i < 8; i++) arp.push(midi(chordTones(ch)[i % 3] + (i >= 3 && i < 6 ? n : 0))); }

  const fit = arr => { const top = Math.max(0, ...arr.filter(Boolean)); const down = top > 88 ? 12 * Math.ceil((top - 88) / 12) : 0; return arr.map(m => m ? m - down : 0); };
  return { bpm: st.bpm + (seed % 5) * 3, mel: fit(mel), hold, bass, arp: fit(arp.map(m => m + 12)).map(m => m - 12), drums: st.drums, lead: st.lead, soft: !!st.soft };
}
const TUNES = {};
function tuneFor(name) {
  if (!TUNES[name]) {
    if (name.startsWith('L')) { const L = LEVELS[+name.slice(1) - 1]; TUNES[name] = buildTune(styleForLevel(L), L.n); }
    else TUNES[name] = buildTune(name, name === 'think' ? 3 : 1);
  }
  return TUNES[name];
}
let noiseBuf = null;
const Music = {
  tune: null, step: 0, next: 0, out: null,
  want(name) {
    if (!AC || !save.music || document.hidden) { this.tune = null; return; }
    if (!this.out) { this.out = AC.createGain(); this.out.gain.value = 1; this.out.connect(AC.destination); }
    if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    if (name !== this.tune) { this.tune = name; this.step = 0; this.next = AC.currentTime + 0.15; }
    this.out.gain.setTargetAtTime(Voice.speaking ? 0.3 : 1, AC.currentTime, 0.15); // quieter while someone talks
    const tn = tuneFor(name), dt = 60 / tn.bpm / 2, v = tn.soft ? 0.6 : 1;
    while (this.next < AC.currentTime + 0.3) {
      const i = this.step % tn.mel.length, t = this.next;
      if (tn.mel[i]) this.note(tn.mel[i], t, dt * (tn.hold[i] + 0.4), tn.lead, (tn.lead === 'square' ? 0.03 : 0.05) * v);
      if (tn.bass[i]) this.note(tn.bass[i], t, dt * 0.9, 'triangle', 0.07 * v);
      if (tn.arp.length) { this.note(tn.arp[i] + 12, t, dt * 0.45, 'sine', 0.022 * v); this.note(tn.arp[(i + 1) % tn.arp.length] + 12, t + dt / 2, dt * 0.45, 'sine', 0.018 * v); }
      const dr = tn.drums[i % tn.drums.length];
      if (dr === 'k' || dr === 'b') this.kick(t);
      if (dr === 's') this.snare(t);
      if (dr === 'h' || dr === 'b') this.hat(t);
      this.next += dt; this.step++;
    }
  },
  note(m, t, d, type, vol) {
    try {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(this.out); o.start(t); o.stop(t + d + 0.05);

    ctx.save(); ctx.beginPath(); rr(924, 300, 302, 220, 24); ctx.fillStyle = '#EAF6FF'; ctx.fill(); ctx.clip();
    const v = vehicleOf(L);
    if (L.mode === 'run') { ctx.save(); ctx.translate(1060, 500); ctx.scale(0.95, 0.95); ctx.translate(-1060, -500); drawRider(L.mount, 1060, 500, T * 8, false, {}); ctx.restore(); }
    else if (L.mode === 'rescue') { ctx.fillStyle = '#3FA7C9'; ctx.fillRect(924, 470, 302, 60); drawFriend(L.friends[0], 1000, 480, 1, true); drawPlane(1110, 380, { s: 0.8 }); }
    else if (L.mode === 'catch') { drawHridu(1075, 400, 1.0, {}); ctx.fillStyle = '#B07A42'; ctx.beginPath(); ctx.moveTo(1020, 470); ctx.lineTo(1130, 470); ctx.lineTo(1115, 505); ctx.lineTo(1035, 505); ctx.fill(); drawStar(1000, 340 + (T * 60) % 80, 16, '#FFC21A'); }
    else if (L.mode === 'maze') { for (let y = 0; y < 5; y++) for (let x = 0; x < 7; x++) if ((x * 7 + y * 3) % 4 === 0 || x === 0 || y === 0 || x === 6 || y === 4) fillRR(960 + x * 34, 330 + y * 34, 32, 32, 6, '#B9A6E8'); drawHridu(1060, 405, 0.4, {}); }
    else if (v === 'dolphin') drawDiveRider(1075, 430 + Math.sin(T * 2) * 8, T * 6, {});
    else if (v === 'rocket') drawRocket(1070, 410 + Math.sin(T * 2) * 8, { s: 0.9 });
    else drawPlane(1075, 410 + Math.sin(T * 2) * 8, { s: 1.0 });
    if (L.mode === 'gates') { fillRR(950, 312, 170, 50, 20, '#FFC21A'); text('34 + 25 = ?', 1035, 338, 26, INK, 'center', 700); }
    ctx.restore();
    const tot = totalStars(), maxStars = LEVELS.length * 3;
    drawStar(940, 540, 14, '#FFC21A', '#E09A00'); text(`${tot} / ${maxStars} stars`, 962, 541, 22, INK, 'left', 700);
    if (lock) { fillRR(924, 568, 302, 72, 24, '#DCE4F0'); text(`Need ${c.need} stars`, 1075, 604, 28, '#5A668A', 'center', 700); }
    else { fillRR(924, 568, 302, 72, 24, '#FFC21A'); text(usingTouch ? 'Tap to play' : 'OK to play', 1075, 604, 32, INK, 'center', 700); }
    text(`Puzzle in ${fmtTime(breakEvery() - save.clock)}`, 1075, 666, 20, '#4A5672', 'center', 700);
    fillRR(20, 20, 120, 52, 22, 'rgba(255,255,255,0.9)'); text(usingTouch ? '◀ Home' : 'Back', 80, 47, 22, INK, 'center', 700);
    if (lock || this.msgT > T) {
      fillRR(60, 610, 800, 84, 26, 'rgba(27,42,74,0.92)');
      text(`Chapter ${c.n} opens at ${c.need} stars — you have ${tot}.`, 460, 640, 26, '#FFFFFF', 'center', 700);
      text('Replay levels and keep all 3 hearts to earn 3 stars!', 460, 674, 22, '#FFE88A', 'center', 600);
    }
  }
}

class Title {
  constructor() { this.sel = 0; this.isRoot = true; this.off = 0; }
  items() { const it = ['Play', 'Settings']; if (canInstall()) it.push('Install as an app'); if (updateAvailable()) it.push('Update to new version'); return it; }
  rects() { const n = this.items().length, step = n > 3 ? 74 : 86; return this.items().map((s, k) => ({ x: W / 2 - 230, y: 394 + k * step + (k ? 6 : 0), w: 460, h: k === 0 ? 70 : 60 })); }
  choose(k) {
    SFX.move();
    if (k === 0) { if (!save.seenIntro) { save.seenIntro = true; persist(); scene = new Story(PROLOGUE, 'meadow', () => goMap(1), { title: "Hridu's Great Rescue", kicker: 'The story begins' }); } else goMap(); }
    else if (k === 1) scene = new Settings();
    else if (this.items()[k] === 'Update to new version') { if (Update.state !== 'downloading' && Update.state !== 'installing') { Update.state = 'downloading'; Update.detail = '0'; try { window.HriduApp.installUpdate(); } catch (e) { Update.state = 'failed'; } } }
    else installApp(this);
  }
  onAction(a) {
    const n = this.items().length;
    if (a === 'up') { this.sel = (this.sel + n - 1) % n; SFX.move(); }
    else if (a === 'down') { this.sel = (this.sel + 1) % n; SFX.move(); }
    else if (a === 'ok') this.choose(this.sel);
  }
  onTap(x, y) { this.rects().forEach((r, k) => { if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { this.sel = k; this.choose(k); } }); }
  update(dt) { this.off += dt * 120; }
  draw() {
    drawBG('hills', this.off, 'fly');
    drawPlane(360 + Math.sin(T * 0.8) * 40, 250 + Math.sin(T * 1.6) * 18, { s: 1.15, wave: true, tilt: Math.cos(T * 1.6) * 0.06 });
    drawGrumble(1090, 210, 0.75, 'angry');
    fillRR(W / 2 - 20, 70, 620, 150, 40, 'rgba(255,255,255,0.95)');
    text("Hridu's", W / 2 + 290, 112, 40, '#B13A16', 'center', 700);
    text('Great Rescue', W / 2 + 290, 168, 66, INK, 'center', 700);
    text('Fly, run, rescue — and solve puzzles!', W / 2, 360, 30, INK, 'center', 700);
    this.rects().forEach((r, k) => {
      if (k === this.sel) fillRR(r.x - 8, r.y - 8, r.w + 16, r.h + 16, 30, '#FFC21A');
      const upd = this.items()[k] === 'Update to new version';
      fillRR(r.x, r.y, r.w, r.h, 24, k === 0 ? '#2E9C5B' : upd ? '#2F6FD0' : '#FFFFFF');
      text(this.items()[k], W / 2, r.y + r.h / 2 + 1, k === 0 ? 42 : 30, (k === 0 || upd) ? '#FFFFFF' : INK, 'center', 700);
    });
    const um = updateMessage();
    if (um) { this.toast = um; this.toastT = T + 1; }
    if (window.HriduApp && Update.current) text('v1.' + Update.current + (updateAvailable() ? '  ·  new: v1.' + Update.latest : ''), W - 20, H - 16, 18, 'rgba(27,42,74,0.7)', 'right', 600);
    if (this.toast && this.toastT > T) {
      const tl = wrapLines(this.toast, 980, 26, 700), th = 30 + tl.length * 34;
      fillRR(W / 2 - 520, 236, 1040, th, 22, INK);
      tl.forEach((ln, k) => text(ln, W / 2, 236 + 32 + k * 34, 26, '#FFFFFF', 'center', 700));
    }
  }
}

// Settings: Hridu picks his outfit (big preview); grown-ups set the puzzle
// timer (3 or 5 min), sound effects and music.
class Settings {
  constructor() { this.sel = 0; this.isRoot = false; }
  rows() { return [
    { id: 'outfit', label: 'Outfit', value: outfit().name },
    { id: 'interval', label: 'Puzzle every', value: `${save.interval} min` },
    { id: 'sound', label: 'Sound effects', value: save.sound ? 'On' : 'Off' },
    { id: 'music', label: 'Music', value: save.music ? 'On' : 'Off' },
    { id: 'done', label: 'Done', value: '' },
  ]; }
  rects() { return this.rows().map((r, k) => ({ x: 650, y: 150 + k * 100, w: 560, h: 80 })); }
  change(id, dir) {
    if (id === 'outfit') { const i = OUTFITS.findIndex(x => x.id === save.outfit); const n = OUTFITS[(Math.max(0, i) + dir + OUTFITS.length) % OUTFITS.length]; save.outfit = n.id; Voice.say(n.name, 'hridu'); }
    else if (id === 'interval') { save.interval = save.interval === 3 ? 5 : 3; save.clock = Math.min(save.clock, save.interval * 60 - 5); }
    else if (id === 'sound') save.sound = !save.sound;
    else if (id === 'music') save.music = !save.music;
    else if (id === 'done') { scene = new Title(); scene.sel = 1; return; }
    SFX.move(); persist();
  }
  onAction(a) {
    const rows = this.rows(), n = rows.length, id = rows[this.sel].id;
    if (a === 'up') { this.sel = (this.sel + n - 1) % n; SFX.move(); }
    else if (a === 'down') { this.sel = (this.sel + 1) % n; SFX.move(); }
    else if ((a === 'left' || a === 'right') && id !== 'done') this.change(id, a === 'left' ? -1 : 1);
    else if (a === 'ok') this.change(id, 1);
    else if (a === 'back') { scene = new Title(); scene.sel = 1; }
  }
  onTap(x, y) {
    if (y > 470 && y < 600 && x > 60 && x < 160) { this.sel = 0; this.change('outfit', -1); return; }
    if (y > 470 && y < 600 && x > 480 && x < 580) { this.sel = 0; this.change('outfit', 1); return; }
    this.rects().forEach((r, k) => { if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { this.sel = k; this.change(this.rows()[k].id, 1); } });
  }
  update() {}
  draw() {
    drawBG('meadow', T * 30, 'run');
    fillRR(40, 30, 1200, 660, 36, 'rgba(255,255,255,0.93)');
    text('Settings', 340, 90, 48, INK, 'center', 700);
    // outfit preview
    fillRR(80, 140, 520, 470, 30, '#EAF6FF');
    drawHridu(340, 260, 2.6, { wave: true });
    ctx.font = font(34, 700); text(outfit().name, 340, 560, 34, INK, 'center', 700);
    for (const [ax, ch] of [[110, '◀'], [570, '▶']]) { circle(ax, 540, 34, this.sel === 0 ? '#FFC21A' : '#DCE4F0'); text(ch, ax, 542, 30, INK, 'center', 700); }
    text(`${OUTFITS.findIndex(x => x.id === save.outfit) + 1} of ${OUTFITS.length}`, 340, 596, 20, '#4A5672', 'center', 600);
    // rows
    const rows = this.rows();
    this.rects().forEach((r, k) => {
      const row = rows[k], sel = k === this.sel;
      if (sel) fillRR(r.x - 8, r.y - 8, r.w + 16, r.h + 16, 30, '#FFC21A');
      fillRR(r.x, r.y, r.w, r.h, 24, row.id === 'done' ? '#2E9C5B' : '#FFFFFF');
      if (row.id === 'done') { text('Done', r.x + r.w / 2, r.y + r.h / 2 + 1, 34, '#FFFFFF', 'center', 700); return; }
      text(row.label, r.x + 28, r.y + r.h / 2 + 1, 28, INK, 'left', 700);
      text(row.value, r.x + r.w - (sel && !usingTouch ? 92 : 28), r.y + r.h / 2 + 1, 28, '#2F6FD0', 'right', 700);
      if (sel && !usingTouch) { text('◀ ▶', r.x + r.w - 30, r.y + r.h / 2 + 1, 18, INK, 'right', 700); }
    });
    text('Grown-ups: the puzzle timer is how much play time before each Puzzle Pit Stop.', W / 2, 668, 18, '#4A5672', 'center', 600);
  }
}

/* ---------------- installable app (PWA) ---------------- */
let installEvt = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// Note: the game itself goes full-screen on the first tap, which also matches
// display-mode: fullscreen — so only count that when the browser didn't do it for us.
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true ||
  (matchMedia('(display-mode: fullscreen)').matches && !document.fullscreenElement && !document.webkitFullscreenElement);
const isWeb = location.protocol === 'https:' || location.hostname === 'localhost';
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
addEventListener('appinstalled', () => { installEvt = null; });
function canInstall() { return isWeb && !isInstalled(); }
function installHelp() {
  const ua = navigator.userAgent;
  if (isIOS) return 'Tap the Share button, then "Add to Home Screen"';
  if (/Android/.test(ua)) return /Firefox/.test(ua) ? 'Open the browser menu (⋮) and tap "Install"' : 'Open the browser menu (⋮) and tap "Install app" or "Add to Home screen"';
  if (/Edg\//.test(ua)) return 'Click the "App available" icon in the address bar, or menu (…) → Apps → Install';
  if (/Chrome\//.test(ua)) return 'Click the install icon at the right end of the address bar, or menu (⋮) → Cast, save and share → Install';
  if (/Safari\//.test(ua)) return 'In Safari, choose File → Add to Dock';
  return 'Open this page in Chrome or Edge to install it as an app';
}
function installApp(title) {
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; }); return; }
  title.toast = installHelp(); title.toastT = T + 9;
}
if ('serviceWorker' in navigator && isWeb) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ---------------- app updates (TV/phone APK only) ----------------
   The Android app checks GitHub's latest Release on start; if it's newer,
   the title screen offers "Update to new version", which downloads it and
   opens Android's own install-update screen. */
const Update = { latest: 0, current: 0, state: '', detail: '' };
window.hriduUpdateInfo = (latest, current) => { Update.latest = latest; Update.current = current; };
window.hriduUpdateStatus = (state, detail) => { Update.state = state; Update.detail = detail; };
const updateAvailable = () => !!window.HriduApp && Update.latest > Update.current;
function updateMessage() {
  const st = Update.state, d = Update.detail;
  if (st === 'downloading') return `Downloading the new version… ${d}%`;
  if (st === 'installing') return 'Almost there! Press "Update" / "Install" on the next screen.';
  if (st === 'permission') return 'One-time step: turn ON "Allow from this source" for Hridu\'s Great Rescue, then press Back and choose Update again.';
  if (st === 'failed') return d || 'The update did not work. Try again.';
  if (st === 'done') return 'Updated! Open the game again.';
  return '';
}
if (window.HriduApp) { try { Update.current = window.HriduApp.versionCode(); window.HriduApp.checkUpdate(); } catch (e) {} }

/* ---------------- boot ---------------- */
resize();
scene = new Title();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  ctx.setTransform(K, 0, 0, K, 0, 0);
  try { if (scene.update) scene.update(dt); scene.draw(); } catch (e) { console.error(e); }
  try { Music.want(musicFor(scene)); } catch (e) {}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('700 20px Fredoka').catch(() => {});
cv.focus();
</script>
