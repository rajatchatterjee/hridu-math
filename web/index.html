<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16203A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hridu's Great Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Hridu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{margin:0;height:100%;background:#16203A;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;outline:none}
#rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#16203A;color:#fff;font:600 24px Fredoka,"Trebuchet MS",Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
#rotate button{font:inherit;font-size:20px;padding:12px 22px;border-radius:14px;border:0;background:#FFC21A;color:#1B2A4A}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="Hridu's Great Rescue game"></canvas></div>
<div id="rotate">
  <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="#FFC21A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M2 12a10 10 0 0 0 4 8"/><path d="M4 21l2-1-.5-2.2"/></svg>
  <div>Turn your phone sideways to play</div>
  <button type="button" id="rotateBtn">Play anyway</button>
</div>
<script>
'use strict';
/* =====================================================================
   Hridu's Great Rescue — a kids' adventure game with puzzle pit stops.
   One file, no build step. Works with a TV remote (D-pad + OK + Back),
   a keyboard (arrows / Enter / Esc) and touch (on-screen buttons).
   URL params for testing: ?break=30 (puzzle every 30 s), ?level=N
   ===================================================================== */
const W = 1280, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'Fredoka,"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif';
const font = (s, w) => `${w || 600} ${s}px ${FONT}`;
let K = 1, T = 0;

/* ---------------- save data ---------------- */
const SAVE_KEY = 'hridu-math-v1';
let save = { unlocked: 1, stars: {}, interval: 5, sound: true, clock: 0, solved: 0, seenIntro: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const params = new URLSearchParams(location.search);
const BREAK_OVERRIDE = +params.get('break') || 0;
if (save.interval !== 3 && save.interval !== 5) save.interval = 5; // only 3 or 5 min allowed
const breakEvery = () => BREAK_OVERRIDE || save.interval * 60;
if (+params.get('level')) save.unlocked = Math.max(save.unlocked, Math.min(8, +params.get('level')));

/* ---------------- helpers ---------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weighted(obj) { let tot = 0; for (const k in obj) tot += obj[k]; let r = Math.random() * tot; for (const k in obj) { r -= obj[k]; if (r <= 0) return k; } return Object.keys(obj)[0]; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtTime = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fillRR(x, y, w, h, r, c) { rr(x, y, w, h, r); ctx.fillStyle = c; ctx.fill(); }
function circle(x, y, r, c) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function ell(x, y, rx, ry, c, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function line(x1, y1, x2, y2, c, w) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
function text(s, x, y, size, color, align, weight, base) { ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle'; ctx.fillText(s, x, y); }
function wrapLines(s, maxW, size, weight) {
  ctx.font = font(size, weight); const out = [];
  for (const para of String(s).split('\n')) {
    let cur = '';
    for (const w of para.split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
    out.push(cur);
  }
  return out;
}
function starPath(x, y, r, inner) { inner = inner || 0.45; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } ctx.closePath(); }
function drawStar(x, y, r, c, stroke) { starPath(x, y, r); ctx.fillStyle = c; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(2, r / 8); ctx.lineJoin = 'round'; ctx.stroke(); } }
function heartPath(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s * 0.35); ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.45, y - s * 1.05, x, y - s * 0.45); ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35); ctx.closePath(); }
function drawHeart(x, y, s, c) { heartPath(x, y, s); ctx.fillStyle = c; ctx.fill(); }
function pill(x, y, w, h, c) { fillRR(x, y, w, h, h / 2, c); }

/* ---------------- audio ---------------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type, v, slide) {
  if (!save.sound || !AC) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(v || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const seq = (notes, gap, type, v) => notes.forEach((f, i) => setTimeout(() => tone(f, 0.18, type || 'triangle', v || 0.13), i * gap));
const SFX = {
  jump: () => tone(380, 0.18, 'square', 0.06, 320),
  coin: () => seq([880, 1320], 70, 'triangle', 0.1),
  hit: () => tone(200, 0.32, 'sawtooth', 0.1, -130),
  ok: () => seq([523, 659, 784], 90),
  bad: () => tone(240, 0.28, 'triangle', 0.12, -70),
  move: () => tone(620, 0.05, 'sine', 0.05),
  pick: () => seq([660, 990], 60, 'sine', 0.1),
  win: () => seq([523, 659, 784, 1047], 120),
  rescue: () => seq([587, 784, 988, 1175], 80),
};

/* ---------------- input ---------------- */
const held = { up: false, down: false };
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Enter: 'ok', NumpadEnter: 'ok', Space: 'ok', ' ': 'ok', Escape: 'back', Backspace: 'del', KeyP: 'back', GoBack: 'back', BrowserBack: 'back' };
const CODEMAP = { 38: 'up', 40: 'down', 37: 'left', 39: 'right', 13: 'ok', 32: 'ok', 27: 'back', 8: 'del', 19: 'up', 20: 'down', 21: 'left', 22: 'right', 23: 'ok', 66: 'ok', 4: 'back' };
const keyAction = e => KEYMAP[e.code] || KEYMAP[e.key] || CODEMAP[e.keyCode] || null;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let usingTouch = isTouch;
let scene = null;
function act(a) {
  if (a === 'del' && !(scene && scene.wantsDel)) a = 'back';
  if (scene && scene.onAction) scene.onAction(a);
}
// Number keys (keyboard, numpad, or number buttons on a TV remote).
function digitOf(e) {
  if (/^[0-9]$/.test(e.key)) return e.key;
  if (e.keyCode >= 48 && e.keyCode <= 57) return String(e.keyCode - 48);
  if (e.keyCode >= 96 && e.keyCode <= 105) return String(e.keyCode - 96);
  return null;
}

addEventListener('keydown', e => {
  const dg = digitOf(e);
  if (dg !== null) { if (scene && scene.onDigit) { e.preventDefault(); audio(); usingTouch = false; if (!e.repeat) scene.onDigit(dg); } return; }
  const a = keyAction(e); if (!a) return;
  e.preventDefault(); audio(); usingTouch = false;
  if (a === 'up' || a === 'down') { const was = held[a]; held[a] = true; if (was && e.repeat && scene && scene.holdOnly) return; }
  if (e.repeat && (a === 'ok' || a === 'back')) return;
  act(a);
});
addEventListener('keyup', e => { const a = keyAction(e); if (a === 'up' || a === 'down') held[a] = false; });
addEventListener('blur', () => { held.up = held.down = false; });

function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
const touchDown = new Map();
let triedFull = false;
function goFull() {
  if (!isTouch || triedFull) return; triedFull = true;
  const el = document.documentElement;
  try { const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {}); } catch (e) {}
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  if (e.pointerType === 'touch') usingTouch = true;
  goFull();
  const p = toLocal(e);
  const btns = scene && scene.touchButtons ? scene.touchButtons() : [];
  for (const b of btns) {
    if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 14) {
      touchDown.set(e.pointerId, b.id);
      if (b.id === 'up' || b.id === 'down') held[b.id] = true;
      act(b.id); return;
    }
  }
  if (scene && scene.onTap) scene.onTap(p.x, p.y);
});
function releasePointer(e) { const id = touchDown.get(e.pointerId); if (id) { touchDown.delete(e.pointerId); if (id === 'up' || id === 'down') held[id] = false; } }
addEventListener('pointerup', releasePointer);
addEventListener('pointercancel', releasePointer);
cv.addEventListener('contextmenu', e => e.preventDefault());

// Android TV wrapper calls this on the remote's Back button. Return false to let the app close.
window.hriduBack = function () { if (!scene || scene.isRoot) return false; act('back'); return true; };
document.addEventListener('visibilitychange', () => { if (document.hidden && scene && scene.autoPause) scene.autoPause(); });

/* ---------------- layout ---------------- */
let rotateDismissed = false;
document.getElementById('rotateBtn').onclick = () => { rotateDismissed = true; resize(); };
function resize() {
  const vw = innerWidth, vh = innerHeight;
  const s = Math.min(vw / W, vh / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const bw = Math.min(1920, Math.round(cw * dpr));
  K = bw / W; cv.width = bw; cv.height = Math.round(H * K);
  document.getElementById('rotate').style.display = (isTouch && vh > vw * 1.05 && !rotateDismissed) ? 'flex' : 'none';
}
addEventListener('resize', resize);

/* =====================================================================
   CHARACTERS
   ===================================================================== */
const SKIN = '#EBBE98', SKIN_D = '#D9A47C', HAIR = '#1C1A22', INK = '#1B2A4A';
const NAVY = '#1F3B73', SLEEVE = '#5BB8E8';

// Hridu: (x,y) is the centre of his head. Round cheeky face, big curly black
// hair with short sides, bold brows, navy zip-up top with sky-blue sleeves.
function drawHridu(x, y, s, o) {
  o = o || {}; ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.body !== false) {
    ctx.lineCap = 'round';
    const lHand = o.wave ? [-36, -12 + Math.sin(T * 10) * 8] : [-32, 54];
    const rHand = o.cheer ? [36, -10 + Math.sin(T * 9) * 6] : [30, 54];
    line(-17, 32, lHand[0], lHand[1], SLEEVE, 11); circle(lHand[0], lHand[1], 6, SKIN);
    line(17, 32, rHand[0], rHand[1], SLEEVE, 11); circle(rHand[0], rHand[1], 6, SKIN);
    fillRR(-23, 20, 46, 48, 15, NAVY);
    fillRR(-23, 20, 46, 8, 4, SLEEVE);
    line(0, 26, 0, 64, '#4E6FA8', 2.5);
    drawStar(12, 50, 5, '#FFC21A');
  }
  // short sides + ears
  ell(-22, -4, 5, 9, HAIR); ell(22, -4, 5, 9, HAIR);
  ell(-25, 4, 5.5, 7, SKIN_D); ell(25, 4, 5.5, 7, SKIN_D);
  // round, chubby face
  ell(0, 2, 25, 25, SKIN);
  ell(-13, 12, 9, 7, SKIN); ell(13, 12, 9, 7, SKIN);
  // big curly hair on top
  ctx.beginPath(); ctx.ellipse(0, -11, 25, 13, 0, Math.PI, 0); ctx.fillStyle = HAIR; ctx.fill();
  for (const [cx, cy, r] of [[-20, -14, 8], [-12, -22, 10], [0, -26, 11], [12, -23, 10], [21, -15, 8], [-6, -17, 8], [8, -16, 8], [-17, -6, 6], [4, -8, 6]]) circle(cx, cy, r, HAIR);
  ctx.strokeStyle = '#3A3644'; ctx.lineWidth = 1.8;
  for (const [cx, cy] of [[-12, -24], [0, -29], [12, -25], [-4, -18], [9, -18]]) { ctx.beginPath(); ctx.arc(cx, cy, 4, 0.8 * Math.PI, 2 * Math.PI); ctx.stroke(); }
  if (o.goggles) {
    line(-24, -18, 24, -18, '#7A4A1E', 3);
    ctx.lineWidth = 3; ctx.strokeStyle = '#7A4A1E'; ctx.fillStyle = 'rgba(191,230,255,0.95)';
    ctx.beginPath(); ctx.arc(-9, -19, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, -19, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  // bold brows, big dark eyes with lashes
  line(-14, -5, -4, -6, HAIR, 3.4); line(4, -6, 14, -5, HAIR, 3.4);
  ell(-8.5, 3, 3.6, 4.4, '#1B1B1B'); ell(8.5, 3, 3.6, 4.4, '#1B1B1B');
  circle(-7.5, 1.6, 1.3, '#FFFFFF'); circle(9.5, 1.6, 1.3, '#FFFFFF');
  line(-12.5, 0, -14.5, -1.5, HAIR, 1.6); line(12.5, 0, 14.5, -1.5, HAIR, 1.6);
  ctx.globalAlpha = 0.3; circle(-15, 12, 5, '#E8828A'); circle(15, 12, 5, '#E8828A'); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(0, 11, o.worried ? 4.5 : 7, o.worried ? 1.15 * Math.PI : 0.15 * Math.PI, o.worried ? 1.85 * Math.PI : 0.85 * Math.PI);
  ctx.strokeStyle = '#A0524A'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
}

// Zippy the toy plane with Hridu in the cockpit. (x,y) = centre of the body.
function drawPlane(x, y, o) {
  o = o || {}; ctx.save(); ctx.translate(x, y); if (o.s) ctx.scale(o.s, o.s); ctx.rotate(o.tilt || 0);
  const red = '#F26B45', dark = '#C9401F';
  ctx.fillStyle = '#E4572E'; ctx.beginPath(); ctx.moveTo(-82, -6); ctx.lineTo(-104, -50); ctx.lineTo(-74, -50); ctx.lineTo(-48, -14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(34, -4); ctx.lineTo(14, -30); ctx.lineTo(-12, -30); ctx.closePath(); ctx.fill();
  if (o.rider !== false) drawHridu(-12, -40, 0.78, { goggles: true, wave: o.wave, worried: o.worried });
  ctx.fillStyle = red; ctx.beginPath(); ctx.moveTo(-96, 0); ctx.bezierCurveTo(-96, -20, -60, -24, -20, -24); ctx.lineTo(60, -24); ctx.bezierCurveTo(92, -24, 106, -12, 106, 2); ctx.bezierCurveTo(106, 16, 92, 26, 60, 26); ctx.lineTo(-40, 26); ctx.bezierCurveTo(-76, 26, -96, 16, -96, 0); ctx.closePath(); ctx.fill();
  fillRR(-64, -5, 46, 9, 4.5, '#FFC21A');
  circle(70, -6, 11, '#FFFFFF'); circle(73, -6, 6, INK); circle(75, -8, 2, '#FFFFFF');
  ctx.beginPath(); ctx.arc(76, 7, 8, 0.1 * Math.PI, 0.8 * Math.PI); ctx.strokeStyle = '#7A2410'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(40, 8); ctx.lineTo(16, 50); ctx.lineTo(-16, 50); ctx.closePath(); ctx.fill();
  fillRR(104, -4, 10, 8, 4, INK);
  ell(118, 0, 5, Math.abs(Math.sin(T * 38)) * 34 + 6, 'rgba(27,42,74,0.5)');
  ctx.restore();
}

// Mounts. (0,0) = ground under the animal's middle, facing right.
const MOUNTS = {
  bunny: { seat: -84, standH: 168, duckH: 116, name: 'Bibi' },
  cheetah: { seat: -86, standH: 172, duckH: 118, name: 'Chiku' },
  camel: { seat: -128, standH: 214, duckH: 146, name: 'Kanta' },
};
function legSwing(ph, off) { return Math.sin(ph + off) * 0.6; }
function drawBunny(ph, still) {
  const hop = still ? 0 : -Math.abs(Math.sin(ph)) * 10;
  ctx.save(); ctx.translate(0, hop);
  ell(-28, -14, 22, 10, '#E2DED6', still ? 0 : legSwing(ph, 0) * 0.5);
  ell(26, -10, 12, 9, '#E2DED6', still ? 0 : legSwing(ph, 2) * 0.5);
  circle(-52, -52, 13, '#FFFFFF');
  ell(0, -48, 52, 34, '#F4F1EC');
  ell(40, -108, 8, 24, '#F4F1EC', -0.25); ell(58, -106, 8, 24, '#F4F1EC', 0.25);
  ell(40, -106, 4, 16, '#F4B6C2', -0.25); ell(58, -104, 4, 16, '#F4B6C2', 0.25);
  circle(50, -72, 25, '#F4F1EC');
  circle(58, -76, 4.5, INK); circle(59.5, -77.5, 1.5, '#FFFFFF');
  ell(73, -68, 5, 4, '#F08AA0');
  ctx.globalAlpha = 0.4; circle(52, -62, 5, '#F4A6B4'); ctx.globalAlpha = 1;
  ctx.restore();
}
function drawCheetah(ph, still) {
  ctx.save();
  ctx.beginPath(); ctx.moveTo(-58, -64); ctx.quadraticCurveTo(-96, -70, -92, -110); ctx.strokeStyle = '#E8A33D'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke();
  const legs = [[-40, 0], [-20, 2], [30, 1], [48, 3]];
  for (const [lx, off] of legs) { const a = still ? 0 : legSwing(ph, off); line(lx, -40, lx + Math.sin(a) * 30, -2, '#E0982F', 12); }
  ell(0, -60, 64, 27, '#F2B544');
  for (const [sx, sy] of [[-34, -66], [-12, -52], [8, -70], [28, -54], [-46, -52], [44, -68], [-20, -76]]) circle(sx, sy, 5, '#7A4A12');
  circle(64, -82, 25, '#F2B544');
  ctx.fillStyle = '#E8A33D'; ctx.beginPath(); ctx.moveTo(48, -98); ctx.lineTo(50, -116); ctx.lineTo(62, -102); ctx.fill();
  ctx.beginPath(); ctx.moveTo(70, -104); ctx.lineTo(80, -118); ctx.lineTo(82, -98); ctx.fill();
  circle(72, -86, 4.5, INK); circle(73.5, -87.5, 1.5, '#FFFFFF');
  line(70, -80, 76, -66, '#7A4A12', 3);
  ell(87, -76, 5, 4, INK);
  ctx.restore();
}
function drawCamel(ph, still) {
  ctx.save();
  const legs = [[-34, 0], [-18, 2], [26, 1], [40, 3]];
  for (const [lx, off] of legs) { const a = still ? 0 : legSwing(ph, off) * 0.7; line(lx, -70, lx + Math.sin(a) * 26, -2, '#C98E55', 11); }
  ctx.beginPath(); ctx.moveTo(-58, -84); ctx.quadraticCurveTo(-72, -70, -66, -54); ctx.strokeStyle = '#C98E55'; ctx.lineWidth = 6; ctx.stroke();
  ell(0, -86, 60, 28, '#D9A066');
  ell(-4, -108, 30, 24, '#D9A066');
  fillRR(-26, -122, 44, 12, 6, '#E4572E');
  line(46, -92, 72, -140, '#D9A066', 20);
  ell(86, -146, 22, 13, '#D9A066', 0.15);
  circle(90, -152, 4, INK); circle(91, -153.5, 1.3, '#FFFFFF');
  ell(70, -156, 5, 7, '#C98E55');
  line(100, -140, 106, -138, '#8A5A2B', 3);
  ctx.restore();
}
function drawMount(kind, ph, still) { if (kind === 'bunny') drawBunny(ph, still); else if (kind === 'cheetah') drawCheetah(ph, still); else drawCamel(ph, still); }
function drawRider(kind, x, y, ph, duck, o) {
  o = o || {}; const m = MOUNTS[kind];
  ctx.save(); ctx.translate(x, y);
  if (duck) ctx.scale(1.12, 0.68);
  drawMount(kind, ph, o.still);

const GROUND = 600;
const gradCache = {};
function skyGrad(th) {
  const k = th.top + th.bot;
  if (!gradCache[k]) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, th.top); g.addColorStop(1, th.bot); gradCache[k] = g; }

}

function drawBG(name, off, mode) {
  const th = THEMES[name] || THEMES.meadow;

    cols.forEach((c, i) => { ctx.beginPath(); ctx.arc(640, 640, 520 - i * 26, Math.PI, 0); ctx.strokeStyle = c; ctx.lineWidth = 26; ctx.globalAlpha = 0.75; ctx.stroke(); });

  for (let i = 0; i < nC; i++) { const x = wrapX(i * 420 - off * (0.15 + (i % 3) * 0.05), 1700) - 200; drawCloud(x, 90 + (i * 97) % (th.cloudy ? 520 : 220), 0.8 + (i % 3) * 0.3, cloudC); }

    ctx.strokeStyle = '#8ED3EA'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 14; i++) { const x = wrapX(i * 170 - off * 0.9, 1400) - 60, y = 625 + (i * 37) % 80; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 15, y - 8, x + 30, y); ctx.quadraticCurveTo(x + 45, y + 8, x + 60, y); ctx.stroke(); }
    return;
  }

  hillPath(off * 0.3, mode === 'run' ? 430 : 560, 60, 1, th.far);
  if (name === 'desert') { for (let i = 0; i < 5; i++) { const x = wrapX(i * 330 - off * 0.45, 1650) - 100; drawCactus(x, 530, 0.5, '#B98A4A'); } }
  hillPath(off * 0.6, mode === 'run' ? 500 : 640, 50, 3, th.near);
  if (th.canopy) {

  }
  if (mode === 'run' || name === 'ending') {
    ctx.fillStyle = th.ground; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = th.grass; ctx.fillRect(0, GROUND - 6, W, 16);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let i = 0; i < 12; i++) { const x = wrapX(i * 140 - off, 1680) - 100; ctx.beginPath(); ctx.ellipse(x, 640 + (i * 29) % 60, 30 + (i % 3) * 10, 6, 0, 0, 7); ctx.fill(); }
  }
  if (th.rain) {

    for (let i = 0; i < 60; i++) { const x = wrapX(i * 97 - off * 1.4 - T * 200, W + 100), y = wrapX(i * 53 + T * 700, H + 60) - 30; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 8, y + 22); ctx.stroke(); }
  }

function levelComplete(play) {
  const n = play.L.n, stars = Math.max(1, play.hearts);
  save.stars[n] = Math.max(save.stars[n] || 0, stars);
  save.unlocked = Math.max(save.unlocked, Math.min(8, n + 1));
  persist();
  scene = new LevelDone(play, stars);
}
class LevelDone {
  constructor(play, stars) { this.play = play; this.stars = stars; this.t = 0; this.isRoot = false; SFX.win(); }
  onAction(a) { if (a === 'ok' || a === 'back') this.go(); }

  go() {
    if (this.t < 0.6) return;
    const L = this.play.L;
    if (L.n === 8) scene = new Story(ENDING(), 'ending', () => goMap(8), { title: 'Everyone is home!', kicker: 'The End' });
    else scene = new Story(L.outro, L.theme, () => goMap(L.n + 1));
  }
  update(dt) { this.t += dt; }
  draw() {
    drawBG(this.play.L.theme, this.t * 60, this.play.L.mode);

class Title {

  items() { const it = ['Play', `Puzzle every: ${save.interval} min`, `Sound: ${save.sound ? 'On' : 'Off'}`]; if (canInstall()) it.push('Install as an app'); return it; }
  rects() { return this.items().map((s, k) => ({ x: W / 2 - 230, y: 386 + k * 76 + (k ? 6 : 0), w: 460, h: k === 0 ? 70 : 60 })); }
  choose(k, dir) {
    SFX.move();
    if (k === 0) { if (!save.seenIntro) { save.seenIntro = true; persist(); scene = new Story(PROLOGUE, 'meadow', () => goMap(1), { title: "Hridu's Great Rescue", kicker: 'The story begins', onBack: () => goMap(1) }); } else goMap(); }

/* ---------------- installable app (PWA) ---------------- */
let installEvt = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// display-mode: fullscreen — so only count that when the browser didn't do it for us.

addEventListener('appinstalled', () => { installEvt = null; });
function canInstall() { return isWeb && !isInstalled(); }
function installHelp() {
  const ua = navigator.userAgent;
  if (isIOS) return 'Tap the Share button, then "Add to Home Screen"';
  if (/Android/.test(ua)) return /Firefox/.test(ua) ? 'Open the browser menu (⋮) and tap "Install"' : 'Open the browser menu (⋮) and tap "Install app" or "Add to Home screen"';
  if (/Edg\//.test(ua)) return 'Click the "App available" icon in the address bar, or menu (…) → Apps → Install';
  if (/Chrome\//.test(ua)) return 'Click the install icon at the right end of the address bar, or menu (⋮) → Cast, save and share → Install';
  if (/Safari\//.test(ua)) return 'In Safari, choose File → Add to Dock';
  return 'Open this page in Chrome or Edge to install it as an app';
}
function installApp(title) {
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; }); return; }
  title.toast = installHelp(); title.toastT = T + 9;
}
if ('serviceWorker' in navigator && isWeb) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

let last = performance.now();

  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  ctx.setTransform(K, 0, 0, K, 0, 0);
