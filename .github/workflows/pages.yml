name: Publish web game

on:
  push:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/pages.yml' ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Publish the game as hridu-great-rescue.html
        # The APK loads web/index.html directly; on the website the game lives at
        # /hridu-great-rescue.html and the bare folder address forwards there.
        run: |
          cp -r web _site
          mv _site/index.html _site/hridu-great-rescue.html
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>Hridu's Great Rescue</title>
          <meta http-equiv="refresh" content="0; url=hridu-great-rescue.html">
          <script>location.replace('hridu-great-rescue.html' + location.search + location.hash);</script>
          </head><body><a href="hridu-great-rescue.html">Play Hridu's Great Rescue</a></body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the game is live
        # Loads the published page (with a cache-buster) and fails the run if
        # it is missing, so a broken publish shows up as a red run.
        run: |
          url="${{ steps.deployment.outputs.page_url }}hridu-great-rescue.html?check=${{ github.run_id }}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$url")
            echo "try $i: $code"
            if [ "$code" = "200" ] && grep -q "Hridu's Great Rescue" /tmp/page.html; then echo "LIVE: $url"; exit 0; fi
            sleep 10
          done
          echo "Game page not reachable at $url"; exit 1
