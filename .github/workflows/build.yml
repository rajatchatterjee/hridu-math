name: Build TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        # ubuntu-latest already ships the Android SDK; just accept licenses.
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hridu-great-rescue.apk

      - name: Publish a GitHub Release with the APK
        # A Release asset is a plain public github.com link that the TV's
        # Downloader app can fetch directly (Actions artifacts need a login).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: hridu-great-rescue.apk
          make_latest: true
